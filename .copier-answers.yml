# Changes here will be overwritten by Copier; edit with `copier update --data`.
_commit: v0.0.111
_src_path: https://github.com/victor-software-house/templates.git
build_os: linux
cargo_min_publish_age: 3 days
cargo_trusted_owners:
- any-victor
ci_runner: github-hosted
clippy_disallowed_methods: []
clippy_disallowed_types: []
default_branch: main
deny_bans: []
deny_ignore:
-   id: RUSTSEC-2026-0374
    reason: basic-toml is unmaintained, with no safe upgrade. askama 0.16 reaches
        it only through its config feature, the one way to load templates from files.
        Remove when askama drops basic-toml or forkctl inlines its templates.
deny_licenses:
-   license: BSD-3-Clause
    reason: encoding_rs, which serde-saphyr pulls in
feature_sets: []
generated_paths: []
github_owner: victor-software-house
layout: workspace
linux_image: ubuntu-26.04
max_width: 100
merge_queue: true
merge_queue_cancel_lower: true
mise_version: 2026.11.6
nightly_fmt: true
pieces:
- hooks
- lint_markdown
- lint_toml
- lint_typos
- openspec
- ci
- drift_check
- rust_tasks
- rustfmt
- clippy
- cargo_lints
- deny
pieces_extra:
- lint_workflows
- machete
- doc_tests
- rustdoc
platforms:
- linux-x64
- linux-arm64
- macos-arm64
project: rust-crate
published: false
repository_visibility: public
rust_nightly: nightly-2026-11-01
rust_version: 1.100.0
test_profiles: []
tokio: false
verify_timeout: 8
workflow_policy:
- drafts
- concurrency
- labels
- permissions
- pins
- mise_env
workflow_policy_namespaces: []
