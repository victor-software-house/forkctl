pre-commit:
  skip:
    - run: test -n "$CI"
  parallel: false
  commands:
    # TODO(FRK-020): remove once a mise release includes jdx/mise#14316.
    warm-remote-tasks:
      priority: 1
      run: env -u GIT_INDEX_FILE mise tasks ls >/dev/null
    version-sync:
      run: mise run version:sync
      stage_fixed: true
    format:
      run: mise run format:fix
      stage_fixed: true
    lint-fix:
      run: mise run lint:fix
      stage_fixed: true
    lint:
      run: mise run lint
    staged-secrets:
      run: mise run --no-deps hooks:secrets:staged

pre-push:
  skip:
    - run: test -n "$CI"
  commands:
    lockfile:
      run: mise install --locked
    verify:
      run: mise run verify
    full-history-secrets:
      run: mise run --no-deps hooks:secrets:history
    qctl-close:
      run: mise run q close-from-git -f 'tasks.yaml'
