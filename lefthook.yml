pre-commit:
  skip:
    - run: test -n "$CI"
  parallel: false
  commands:
    version-sync:
      run: mise run version:sync
      stage_fixed: true
    format:
      run: mise run format:fix
      stage_fixed: true
    lint-fix:
      run: mise run lint:fix
      stage_fixed: true
    lint:
      run: mise run lint
    staged-secrets:
      run: mise run --no-deps hooks:secrets:staged

pre-push:
  skip:
    - run: test -n "$CI"
  commands:
    verify:
      run: mise run verify
    full-history-secrets:
      run: mise run --no-deps hooks:secrets:history
