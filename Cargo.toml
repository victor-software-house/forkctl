[package]
name = "forkctl"
version.workspace = true
edition = "2024"
rust-version = "1.97.1"
description = "Control audited StGit downstream patch stacks"
license = "MIT"
repository = "https://github.com/victor-software-house/forkctl"
homepage = "https://github.com/victor-software-house/forkctl"
readme = "README.md"
keywords = ["git", "stgit", "fork", "patches", "cli"]
categories = ["command-line-utilities", "development-tools"]

[lints]
workspace = true

[workspace]
members = ["xtask"]
resolver = "3"

[workspace.package]
version = "0.0.13"

[workspace.lints.rust]
unsafe_code = "forbid"

[workspace.lints.clippy]
all = { level = "deny", priority = -1 }
pedantic = { level = "deny", priority = -1 }

[profile.release]
codegen-units = 1
lto = "thin"
panic = "abort"
strip = "symbols"

[dependencies]
anyhow = "=1.0.104"
anstream = "=1.0.0"
anstyle = "=1.0.14"
askama = { version = "=0.16.0", default-features = false, features = ["config", "derive", "std"] }
clap = { version = "=4.6.5", features = ["derive", "env", "string"] }
clap_complete = { version = "=4.6.8", features = ["unstable-dynamic"] }
comfy-table = { version = "=7.2.2", default-features = false, features = ["custom_styling"] }
globset = { version = "=0.4.19", default-features = false }
schemars = "=1.2.2"
serde = { version = "=1.0.229", features = ["derive"] }
serde_json = "=1.0.151"
tempfile = "=3.27.0"
usage-lib = { version = "=4.1.0", default-features = false, features = ["clap"] }

[dev-dependencies]
insta = { version = "=1.48.0", features = ["json"] }
