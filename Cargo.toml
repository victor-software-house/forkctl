[package]
name = "forkctl"
version.workspace = true
edition = "2024"
rust-version.workspace = true
description = "Control audited StGit downstream patch stacks"
license = "MIT"
repository = "https://github.com/victor-software-house/forkctl"
readme = "README.md"
keywords = ["git", "stgit", "fork", "patches", "cli"]
categories = ["command-line-utilities", "development-tools"]

[lints]
workspace = true

[package.metadata.cargo-machete]
ignored = ["usage-lib"]

[workspace]
members = ["xtask"]
resolver = "3"

[workspace.package]
version = "0.0.44"
rust-version = "1.99.0"

[workspace.lints.rust]
unsafe_code = "forbid"
missing_docs = "deny"
missing_debug_implementations = "deny"
unreachable_pub = "deny"
rust_2018_idioms = { level = "deny", priority = -1 }

[workspace.lints.rustdoc]
broken_intra_doc_links = "deny"
private_intra_doc_links = "deny"
invalid_html_tags = "deny"
invalid_codeblock_attributes = "deny"
# Allow-by-default, so a -D warnings rustdoc build never fires it: an unbalanced
# backtick renders the rest of the paragraph as code.
unescaped_backticks = "deny"

[workspace.lints.clippy]
all = { level = "deny", priority = -1 }
pedantic = { level = "deny", priority = -1 }
cargo = { level = "deny", priority = -1 }
dbg_macro = "deny"
todo = "deny"
unimplemented = "deny"
unwrap_used = "deny"
expect_used = "deny"
disallowed_macros = "deny"
wildcard_enum_match_arm = "deny"
match_wildcard_for_single_variants = "deny"
allow_attributes = "deny"
allow_attributes_without_reason = "deny"
# Duplicate versions come from transitive dependencies the crate does not
# control; cargo-deny reports them (`bans.multiple-versions`).
multiple_crate_versions = "allow"
# forkctl's own, beyond the template.
cognitive_complexity = "deny"
needless_pass_by_ref_mut = "deny"
redundant_clone = "deny"

# Line tables keep backtraces readable at a fraction of full debug info.
[profile.dev]
debug = "line-tables-only"

[profile.release]
codegen-units = 1
lto = "thin"
panic = "abort"
strip = "symbols"

[dependencies]
anyhow = "=1.0.104"
askama = { version = "=0.16.0", default-features = false, features = [
  "config",
  "derive",
  "std",
] }
clap = { version = "=4.6.6", features = ["derive", "env", "string"] }
clap_complete = { version = "=4.6.8", features = ["unstable-dynamic"] }
ctl-core = { version = "=0.6.23", default-features = false, features = [
  "app",
  "input",
  "usage",
] }
globset = { version = "=0.4.19", default-features = false }
schemars = "=1.2.2"
serde = { version = "=1.0.229", features = ["derive"] }
serde_json = "=1.0.151"
semver = "=1.0.28"
shell-words = "=1.1.1"
tempfile = "=3.27.0"
usage-lib = { version = "=6.1.1", default-features = false, features = [
  "clap",
] }
serde-saphyr = { version = "=2.0.0", default-features = false, features = [
  "serialize",
] }
yamled = "=0.0.7"

[dev-dependencies]
ctl-core = { version = "=0.6.23", default-features = false, features = [
  "surface",
] }
insta = { version = "=1.48.0", features = ["json", "filters"] }
minijinja = { version = "=2.24.0", features = ["serde"] }
