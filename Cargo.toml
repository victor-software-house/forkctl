[package]
name = "forkctl"
version = "0.0.2"
edition = "2024"
rust-version = "1.97"
description = "Verify and rebase reusable StGit downstream patch stacks"
license = "MIT"
repository = "https://github.com/victor-software-house/forkctl"
homepage = "https://github.com/victor-software-house/forkctl"
readme = "README.md"
keywords = ["git", "stgit", "fork", "patches", "cli"]
categories = ["command-line-utilities", "development-tools"]
[profile.release]
codegen-units = 1
lto = "thin"
panic = "abort"
strip = "symbols"

[lints.rust]
unsafe_code = "forbid"

[lints.clippy]
all = { level = "deny", priority = -1 }
pedantic = { level = "deny", priority = -1 }

[dependencies]
anyhow = "=1.0.104"
clap = { version = "=4.6.5", features = ["derive"] }
serde = { version = "=1.0.229", features = ["derive"] }
serde_json = "=1.0.151"
tempfile = "=3.27.0"
