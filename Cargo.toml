[package]
name = "forkctl"
version.workspace = true
edition = "2024"
rust-version.workspace = true
description = "Control audited StGit downstream patch stacks"
license = "MIT"
repository = "https://github.com/victor-software-house/forkctl"
readme = "README.md"
keywords = ["git", "stgit", "fork", "patches", "cli"]
categories = ["command-line-utilities", "development-tools"]

[lints]
workspace = true

[package.metadata.cargo-machete]
ignored = ["usage-lib"]

[workspace]
members = ["xtask"]
resolver = "3"

[workspace.package]
version = "0.0.48"
rust-version = "1.99.1"

[workspace.lints.rust]
# deny instead of forbid, because forbid refuses the item-level
# #[expect(unsafe_code, reason = "...")] that a justified exception carries.
unsafe_code = "deny"
# Each unsafe operation inside an unsafe fn sits in its own unsafe block.
unsafe_op_in_unsafe_fn = "deny"
missing_docs = "deny"
missing_debug_implementations = "deny"
unreachable_pub = "deny"
rust_2018_idioms = { level = "deny", priority = -1 }

[workspace.lints.rustdoc]
broken_intra_doc_links = "deny"
private_intra_doc_links = "deny"
invalid_html_tags = "deny"
invalid_codeblock_attributes = "deny"
# Allow-by-default, so a -D warnings rustdoc build never fires it: an unbalanced
# backtick renders the rest of the paragraph as code.
unescaped_backticks = "deny"

[workspace.lints.clippy]
all = { level = "deny", priority = -1 }
pedantic = { level = "deny", priority = -1 }
cargo = { level = "deny", priority = -1 }
dbg_macro = "deny"
todo = "deny"
unimplemented = "deny"
unwrap_used = "deny"
expect_used = "deny"
disallowed_macros = "deny"
wildcard_enum_match_arm = "deny"
match_wildcard_for_single_variants = "deny"
allow_attributes = "deny"
allow_attributes_without_reason = "deny"
# A function that returns Result reports failure through it instead of a panic.
panic_in_result_fn = "deny"
# map_err(|_| ...) drops the cause; wrap it as a source instead. A site whose
# error carries nothing carries #[expect(clippy::map_err_ignore, reason = "...")].
map_err_ignore = "deny"
# `format!` or `push_str` instead of `+` on a String.
string_add = "deny"
# From and TryFrom instead of as, which can silently truncate or wrap. A site
# that truly needs as carries #[expect(clippy::as_conversions, reason = "...")].
as_conversions = "deny"
# Rc<str> and Rc<[T]> instead of Rc<String> or Rc<Vec<T>>.
rc_buffer = "deny"
# Rc::clone(&x), so a cheap pointer clone reads apart from a deep copy.
clone_on_ref_ptr = "deny"
# Every unsafe block carries a // SAFETY: comment and holds one unsafe
# operation, so each comment justifies exactly one call.
undocumented_unsafe_blocks = "deny"
multiple_unsafe_ops_per_block = "deny"
# foo.rs beside foo/, never foo/mod.rs. The Rust Book calls foo.rs the
# idiomatic path and mod.rs the older style (ch07-05, "Alternate File Paths").
# Many files named mod.rs blur together in an editor.
mod_module_files = "deny"
# Duplicate versions come from transitive dependencies the crate does not
# control; cargo-deny reports them (`bans.multiple-versions`).
multiple_crate_versions = "allow"
# forkctl's own, beyond the template.
cognitive_complexity = "deny"
needless_pass_by_ref_mut = "deny"
redundant_clone = "deny"

# The smallest binary that keeps its speed. Against opt-level 3 with thin LTO,
# a ctl CLI came out 35% smaller and 4% slower.
#
# opt-level "z" takes another 25% off but runs a ledger parse 51% slower. A
# repository whose run time does not matter sets it here. Cargo ignores the
# profiles of a dependency, so a library's consumers see none of this.
[profile.release]
opt-level = "s"
lto = "fat"
codegen-units = 1
panic = "abort"
strip = "symbols"

# Line tables keep backtraces readable at a fraction of full debug info.
[profile.dev]
debug = "line-tables-only"

[dependencies]
anyhow = "=1.0.104"
askama = { version = "=0.16.1", default-features = false, features = [
  "config",
  "derive",
  "std",
] }
clap = { version = "=4.6.6", default-features = false, features = [
  # clap does not build without it.
  "std",
  # The `#[derive(Parser)]` grammar in `src/cli.rs`.
  "derive",
  # `env_prefix` binds each long option to a `FORKCTL_*` variable.
  "env",
  # A parse error names the argument and its valid values.
  "error-context",
  # A parse error suggests the nearest flag or verb.
  "suggestions",
] }
clap_complete = { version = "=4.6.8", features = ["unstable-dynamic"] }
ctl-core = { version = "=0.7.0", default-features = false, features = [
  "app",
  "input",
  "usage",
] }
globset = { version = "=0.4.19", default-features = false }
schemars = "=1.2.2"
serde = { version = "=1.0.229", features = ["derive"] }
serde_json = "=1.0.151"
semver = "=1.0.28"
shell-words = "=1.1.1"
tempfile = "=3.27.0"
usage-lib = { version = "=7.3.0", default-features = false, features = [
  "clap",
] }
# serde-saphyr 2.1.1 with two patches, under its own library name, the
# release ctl-core and yamled take, so forkctl links one serde-saphyr.
serde-saphyr = { package = "vsh-serde-saphyr", version = "=0.0.3", default-features = false, features = [
  "serialize",
] }
yamled = "=0.0.12"

[dev-dependencies]
ctl-core = { version = "=0.7.0", default-features = false, features = [
  "surface",
] }
insta = { version = "=1.48.0", features = ["json", "filters"] }
minijinja = { version = "=2.24.0", features = ["serde"] }
