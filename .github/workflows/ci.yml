name: CI

on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]
  merge_group:
  # Refresh the default branch's build cache without repeating every push.
  schedule:
    - cron: "37 8 * * *"
  workflow_dispatch:

# The shared Verify job reads this run and the runs that replaced it.
permissions:
  actions: read
  contents: read
  pull-requests: read

concurrency:
  # Every merge queue entry shares one group, so a newer entry's run cancels the
  # runs of the entries ahead of it: the queue merges on the newest entry's
  # result, whose merge-group commit holds every entry ahead of it. Outside the
  # queue, a draft run gets a group of its own, so it never cancels the ready
  # run.
  group: >-
    ci-${{ github.workflow }}-${{ github.event_name == 'merge_group' && format('queue-{0}',
    github.event.merge_group.base_ref) || format('{0}-{1}{2}', github.event_name,
    github.event.pull_request.number || github.ref_name, github.event.pull_request.draft && '-draft'
    || '') }}
  cancel-in-progress: true

jobs:
  refresh:
    if: github.event_name == 'schedule'
    # One API call on the runner chosen when this repository was rendered.
    runs-on: ubuntu-latest
    timeout-minutes: 2
    permissions:
      actions: write
    steps:
      - name: Dispatch CI on the default branch
        env:
          GH_TOKEN: ${{ github.token }}
          REPOSITORY: ${{ github.repository }}
          WORKFLOW: ${{ github.workflow_ref }}
        run: |
          workflow=${WORKFLOW%@*}
          gh workflow run "${workflow##*/}" --repo "$REPOSITORY" --ref main

  verify:
    if: ${{ !github.event.pull_request.draft && github.event_name != 'schedule' }}
    # The shared jobs that install tools download through the release mirror:
    # they exchange the job's OIDC token for a session token, with the
    # organization's mirror key, so the caller grants id-token: write.
    permissions:
      actions: read
      contents: read
      id-token: write
      pull-requests: read
    uses: victor-software-house/actions/.github/workflows/rust-ci.yml@4168002fe58fd0b310bd2b65f9db2262fc0e21d3 # main, 2026-11-11
    with:
      mise-version: 2026.11.6
      advisories: true
      semver: false
      timeout-minutes: 8
      build-runner: '["ubuntu-latest"]'
      read-only-runner: '["ubuntu-latest"]'
      light-runner: ubuntu-latest
      cache-volume: false
    secrets:
      RELEASE_MIRROR_URL: ${{ secrets.RELEASE_MIRROR_URL }}
      RELEASE_MIRROR_CI_KEY: ${{ secrets.RELEASE_MIRROR_CI_KEY }}

  # What the shared workflow does not run: the suite one test at a time, which
  # catches tests that share process state, and the release binary build.
  isolated:
    if: ${{ !github.event.pull_request.draft && github.event_name != 'schedule' }}
    name: Isolated tests and release build
    runs-on: ubuntu-latest
    # A run takes about 4 to 6 minutes.
    timeout-minutes: 20
    env:
      GIT_CONFIG_COUNT: "1"
      GIT_CONFIG_KEY_0: init.defaultBranch
      GIT_CONFIG_VALUE_0: main
      # The CI profile; local work loads dev from .miserc.toml, which CI never does.
      MISE_ENV: ci
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install locked toolchain
        uses: jdx/mise-action@6612f0ef07ed2a736cd1e00a94a065522dd41195 # v5.2.5
        with:
          version: 2026.11.6
          cache: true
      - name: Cache builds with mbx
        uses: jdx/mr-boxington-action@88acf2bb50552c7c508cbac13e5f8c576b95b1de # v1.7.3
        with:
          github-cache-mode: objects
          isolate-objects-cache: true
      - name: Test process isolation
        run: mise run test:isolated
      - name: Build release binary
        run: mise run build
