name: CI

on:
  # A draft pull request runs no CI; marking it ready starts the run.
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]
  # The queue tests each entry on top of the ones ahead of it, so a push to
  # the default branch has already passed and runs nothing.
  merge_group:
  # A merge_group run saves its build cache on its queue branch, which no pull
  # request can restore from, and a schedule run saves none, so the daily
  # refresh job dispatches this workflow on the default branch, whose run
  # saves the cache pull requests restore from.
  schedule:
    - cron: "37 8 * * *"
  workflow_dispatch:

permissions:
  contents: read
  # A check:versions task reads a pull request that changes a manifest
  # version, to tell the Version PR apart from a hand edit.
  pull-requests: read

concurrency:
  # One run per branch: a new push, or a retarget after the base merges,
  # cancels the run it replaces, on the default branch as on a pull request.
  group: ci-${{ github.workflow }}-${{ github.event_name }}-${{ github.event.pull_request.number || github.ref_name }}
  cancel-in-progress: true

jobs:
  refresh:
    if: github.event_name == 'schedule'
    # One API call: a GitHub-hosted runner, which bills no Namespace units.
    runs-on: ubuntu-latest
    timeout-minutes: 2
    permissions:
      actions: write
    steps:
      - name: Dispatch CI on the default branch
        env:
          GH_TOKEN: ${{ github.token }}
          REPOSITORY: ${{ github.repository }}
          WORKFLOW: ${{ github.workflow_ref }}
        run: |
          workflow=${WORKFLOW%@*}
          gh workflow run "${workflow##*/}" --repo "$REPOSITORY" --ref main

  # The shared workflow runs verify, picks the runner from this repository's
  # visibility, and caches builds with mbx.
  verify:
    if: ${{ !github.event.pull_request.draft && github.event_name != 'schedule' }}
    uses: victor-software-house/actions/.github/workflows/rust-ci.yml@e3e1e593e10a4820e89b489064fa426458d349d0 # main, 2026-10-25
    with:
      mise-version: 2026.10.17
      advisories: true
      semver: false
      timeout-minutes: 8

  # What the shared workflow does not run: the suite one test at a time, which
  # catches tests that share process state, and the release binary build.
  isolated:
    if: ${{ !github.event.pull_request.draft && github.event_name != 'schedule' }}
    name: Isolated tests and release build
    runs-on: ubuntu-latest
    env:
      GIT_CONFIG_COUNT: "1"
      GIT_CONFIG_KEY_0: init.defaultBranch
      GIT_CONFIG_VALUE_0: main
      # The CI profile; local work loads dev from .miserc.toml, which CI never does.
      MISE_ENV: ci
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install locked toolchain
        uses: jdx/mise-action@08ae2a091c038e1e05ec6f5115dc5c69d5a2a6b8 # v5.1.2
        with:
          version: 2026.10.17
          cache: true
      - name: Cache builds with mbx
        uses: jdx/mr-boxington-action@47ce49b32025d93a7a2f4570815afaa2b7092240 # v1.7.2
        with:
          github-cache-mode: objects
          isolate-objects-cache: true
      - name: Test process isolation
        run: mise run test:isolated
      - name: Build release binary
        run: mise run build
