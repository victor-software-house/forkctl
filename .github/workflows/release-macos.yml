name: Release macOS

on:
  workflow_call:
    inputs:
      ref:
        description: Release tag to verify
        required: true
        type: string
  workflow_dispatch:

permissions:
  contents: read

env:
  GIT_CONFIG_COUNT: "1"
  GIT_CONFIG_KEY_0: init.defaultBranch
  GIT_CONFIG_VALUE_0: main
  # The CI profile; local work loads dev from .miserc.toml, which CI never does.
  MISE_ENV: ci

concurrency:
  group: release-macos-${{ github.ref }}
  cancel-in-progress: false

jobs:
  verify:
    name: Verify (macos-latest)
    runs-on: macos-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.ref || github.sha }}
          persist-credentials: false
      - name: Install locked toolchain
        uses: jdx/mise-action@c2a87611a18de5b3828c5652fe268e992400cb5c # v4.3.0
        with:
          version: 2026.10.17
          # Manual gates prove provisioning without restoring an install cache.
          cache: ${{ github.event_name != 'workflow_dispatch' }}
      - name: Verify managed Rust installation
        run: |
          mise x -- sh -eu -c '
            provider=$(command -v rustup)
            sysroot=$(rustc --print sysroot)
            printf "rustup=%s\nsysroot=%s\n" "$provider" "$sysroot"
            test "$provider" = "$CARGO_HOME/bin/rustup"
            case "$sysroot" in
              "$RUSTUP_HOME"/toolchains/*) ;;
              *) exit 1 ;;
            esac
            rustup show active-toolchain
            rustup component list --installed > "$RUNNER_TEMP/rust-components.txt"
            cat "$RUNNER_TEMP/rust-components.txt"
            grep -q "^clippy-" "$RUNNER_TEMP/rust-components.txt"
            if grep -q "^rust-docs-" "$RUNNER_TEMP/rust-components.txt"; then
              exit 1
            fi
            rustup run "$RUST_NIGHTLY" rustfmt --version
          '
      - name: Cache builds with mbx
        uses: jdx/mr-boxington-action@9df1d4b18b2147788a7ee7a2c7b84ecf62fd89d3 # v1.5.0
      - name: Verify
        run: mise run verify
      - name: Test process isolation
        run: mise run test:isolated
      - name: Build release binary
        run: mise run build
