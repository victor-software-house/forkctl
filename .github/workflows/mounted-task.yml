name: Mounted task

on:
  workflow_call:
    inputs:
      tag:
        description: Release tag whose documented consumer configuration to run
        required: true
        type: string
  workflow_dispatch:
    inputs:
      tag:
        description: Published release tag, such as v0.0.29
        required: true

permissions:
  contents: read

env:
  GIT_CONFIG_COUNT: "1"
  GIT_CONFIG_KEY_0: init.defaultBranch
  GIT_CONFIG_VALUE_0: main
  TAG: ${{ inputs.tag }}

jobs:
  run:
    name: Mounted fork task (ubuntu-latest)
    runs-on: ubuntu-latest
    steps:
      - name: Check out the release tag
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ env.TAG }}
          persist-credentials: false
      - name: Install mise
        uses: jdx/mise-action@c2a87611a18de5b3828c5652fe268e992400cb5c # v4.3.0
        with:
          version: 2026.10.3
          install: false
      # A consumer with only the documented mise.toml, whose fork task is pinned to this
      # tag, installs the released binary and StGit and runs forkctl.
      - name: Run the released fork task
        run: |
          consumer=$(mktemp -d)
          cp examples/mise.toml "$consumer/mise.toml"
          mkdir "$consumer/mise-tasks"
          cd "$consumer"
          git init --quiet
          mise trust mise.toml
          reported=$(mise run --quiet fork --version)
          [ "$reported" = "forkctl ${TAG#v}" ] || { printf 'release: mounted task reports %s for %s\n' "$reported" "$TAG" >&2; exit 1; }
          printf '%s\n' "$reported"
