name: Mounted task

on:
  workflow_call:
    inputs:
      tag:
        description: Release tag whose documented consumer configuration to run
        required: true
        type: string
  workflow_dispatch:
    inputs:
      tag:
        description: Published release tag, such as v0.0.29
        required: true

permissions:
  contents: read

env:
  GIT_CONFIG_COUNT: "1"
  GIT_CONFIG_KEY_0: init.defaultBranch
  GIT_CONFIG_VALUE_0: main
  # The CI profile; local work loads dev from .miserc.toml, which CI never does.
  MISE_ENV: ci
  TAG: ${{ inputs.tag }}

# One run per ref at a time. A newer run waits instead of cancelling one in
# progress, as Release macOS does. Inside a call from Release,
# github.workflow names the caller, so the group uses this file's own name.
concurrency:
  group: mounted-task-${{ github.ref }}
  cancel-in-progress: false

jobs:
  run:
    name: Mounted fork task (ubuntu-latest)
    runs-on: ubuntu-latest
    # It installs the released binary and StGit, then runs one fork task.
    timeout-minutes: 15
    steps:
      - name: Check out the release tag
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ env.TAG }}
          persist-credentials: false
      - name: Install mise
        uses: jdx/mise-action@6612f0ef07ed2a736cd1e00a94a065522dd41195 # v5.2.5
        with:
          version: 2026.10.25
          install: false
      # A consumer with only the documented mise.toml, whose fork task is pinned to this
      # tag, installs the released binary and StGit and runs forkctl.
      - name: Run the released fork task
        run: |
          consumer=$(mktemp -d)
          cp examples/mise.toml "$consumer/mise.toml"
          mkdir "$consumer/mise-tasks"
          cd "$consumer"
          git init --quiet
          mise trust mise.toml
          reported=$(mise run --quiet fork --version)
          [ "$reported" = "forkctl ${TAG#v}" ] || { printf 'release: mounted task reports %s for %s\n' "$reported" "$TAG" >&2; exit 1; }
          printf '%s\n' "$reported"
