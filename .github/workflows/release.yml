name: Release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      tag:
        description: Release tag to build and publish again, such as v0.0.30
        required: true

permissions:
  contents: read

env:
  GIT_CONFIG_COUNT: "1"
  GIT_CONFIG_KEY_0: init.defaultBranch
  GIT_CONFIG_VALUE_0: main
  TAG: ${{ inputs.tag || github.ref_name }}

concurrency:
  group: release-${{ inputs.tag || github.ref_name }}
  cancel-in-progress: false

jobs:
  verify-macos:
    name: Verify (macos-latest)
    runs-on: macos-latest
    steps:
      - name: Check out the release tag
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ env.TAG }}
          persist-credentials: false
      - name: Install locked toolchain
        uses: jdx/mise-action@c2a87611a18de5b3828c5652fe268e992400cb5c # v4.3.0
        with:
          version: 2026.9.13
          cache: true
      - name: Cache builds with mbx
        uses: jdx/mr-boxington-action@867fc530102eec5b756075d70d850dc8330d2272 # v1.4.0
      - name: Verify
        run: mise run verify
      - name: Test process isolation
        run: mise run test:isolated

  advisories:
    name: Advisories
    runs-on: ubuntu-latest
    steps:
      - name: Check out the release tag
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ env.TAG }}
          persist-credentials: false
      - name: Install locked toolchain
        uses: jdx/mise-action@c2a87611a18de5b3828c5652fe268e992400cb5c # v4.3.0
        with:
          version: 2026.9.13
          install_args: github:EmbarkStudios/cargo-deny
          cache: true
      - name: RustSec advisories
        run: mise run deny:advisories

  assets:
    name: Asset ${{ matrix.asset }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - asset: linux_x64
            runner: ubuntu-latest
            target: x86_64-unknown-linux-musl
          - asset: macos_arm64
            runner: macos-latest
            target: aarch64-apple-darwin
    runs-on: ${{ matrix.runner }}
    steps:
      - name: Check out the release tag
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ env.TAG }}
          persist-credentials: false
      - name: Install locked Rust toolchain
        uses: jdx/mise-action@c2a87611a18de5b3828c5652fe268e992400cb5c # v4.3.0
        with:
          version: 2026.9.13
          install_args: rust mr-boxington
          cache: true
      - name: Cache builds with mbx
        uses: jdx/mr-boxington-action@867fc530102eec5b756075d70d850dc8330d2272 # v1.4.0
      - name: Add the release target
        run: mise x -- rustup target add "${{ matrix.target }}"
      - name: Build
        run: mise x -- cargo build --release --locked --target "${{ matrix.target }}"
      - name: Package
        env:
          TARGET: ${{ matrix.target }}
          ASSET_KIND: ${{ matrix.asset }}
        run: |
          binary="target/$TARGET/release/forkctl"
          version_output=$("$binary" --version)
          version=${version_output#forkctl }
          [ "v$version" = "$TAG" ] || { printf 'release: binary reports %s for tag %s\n' "$version_output" "$TAG" >&2; exit 1; }
          mkdir -p dist work
          cp "$binary" work/forkctl
          tar czf "dist/forkctl_${version}_${ASSET_KIND}.tar.gz" -C work forkctl
      - name: Keep the asset for publication
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: asset-${{ matrix.asset }}
          path: dist/*.tar.gz
          if-no-files-found: error

  publish:
    name: Publish
    needs: [verify-macos, advisories, assets]
    runs-on: ubuntu-latest
    permissions:
      # Creates, uploads to, and finalizes the GitHub release; no other job writes.
      contents: write
    steps:
      - name: Check out the release tag
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ env.TAG }}
          persist-credentials: false
      - name: Install locked Rust toolchain
        uses: jdx/mise-action@c2a87611a18de5b3828c5652fe268e992400cb5c # v4.3.0
        with:
          version: 2026.9.13
          install_args: rust mr-boxington gh
          cache: true
      - name: Cache builds with mbx
        uses: jdx/mr-boxington-action@867fc530102eec5b756075d70d850dc8330d2272 # v1.4.0
      - name: Collect assets
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          pattern: asset-*
          path: dist
          merge-multiple: true
      - name: Publish
        env:
          GH_TOKEN: ${{ github.token }}
          CARGO_REGISTRY_TOKEN: ${{ secrets.CARGO_REGISTRY_TOKEN }}
        run: mise run release:publish
