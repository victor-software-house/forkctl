name: Release

# verctl's reusable release workflow, on every push to main and on demand.
# It plans every version commit not yet fully released and publishes each at
# that commit, whatever main's HEAD is now, builds the tarballs its Release
# lacks, then opens or updates the Version PR on verctl/release/main. When the
# pushed commit is the one released, the macOS gates and the mounted task run
# against its tag; either workflow also runs by hand for an older tag.
on:
  push:
    branches: [main]
  workflow_dispatch:

permissions: {}

jobs:
  release:
    permissions:
      contents: write # tags, Releases, assets, and verctl/release/main without the App
      pull-requests: write # the Version PR without the App
    uses: victor-software-house/verctl/.github/workflows/release.yml@cfc455ec4f2a93b591f84f788277af99cb1c1d90 # v0.5.0
    with:
      mise-version: 2026.10.9
      mise-env: ci
      auto-merge: true
    # The App token opens the Version PR so that its CI starts; a PR opened
    # with GITHUB_TOKEN starts no workflow.
    secrets:
      app-client-id: ${{ secrets.CHANGESET_VERSION_APP_CLIENT_ID }}
      app-private-key: ${{ secrets.CHANGESET_VERSION_APP_PRIVATE_KEY }}
      registry-token: ${{ secrets.CARGO_REGISTRY_TOKEN }}

  # The reusable workflow exposes no outputs, so the tag is read back from
  # the repository: the release tag that names the pushed commit, if any.
  tag:
    name: Find the release tag
    needs: release
    runs-on: ubuntu-latest
    permissions:
      contents: read
    outputs:
      tag: ${{ steps.tag.outputs.tag }}
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0
      - name: Find the tag on the pushed commit
        id: tag
        run: echo "tag=$(git tag --points-at "${GITHUB_SHA}" --list 'v*')" >> "${GITHUB_OUTPUT}"

  # A release created with GITHUB_TOKEN triggers no `release` workflow, so the
  # macOS gates are called here.
  macos:
    name: macOS gates
    needs: tag
    if: needs.tag.outputs.tag != ''
    permissions:
      contents: read
    uses: ./.github/workflows/release-macos.yml
    with:
      ref: ${{ needs.tag.outputs.tag }}

  mounted-task:
    name: Mounted task
    needs: tag
    if: needs.tag.outputs.tag != ''
    permissions:
      contents: read
    uses: ./.github/workflows/mounted-task.yml
    with:
      tag: ${{ needs.tag.outputs.tag }}
