name: Release Linux

on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      tag:
        description: Published release tag to attach the Linux asset to, such as v0.0.28
        required: true

permissions:
  contents: read

env:
  TAG: ${{ github.event.release.tag_name || inputs.tag }}
  TARGET: x86_64-unknown-linux-musl

concurrency:
  group: release-linux-${{ github.event.release.tag_name || inputs.tag }}
  cancel-in-progress: false

jobs:
  asset:
    name: Linux x64 asset
    runs-on: ubuntu-latest
    permissions:
      # Uploads the release asset; no other job writes.
      contents: write
    steps:
      - name: Check out the release tag
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ env.TAG }}
          persist-credentials: false
      - name: Install locked Rust toolchain
        uses: jdx/mise-action@c2a87611a18de5b3828c5652fe268e992400cb5c # v4.3.0
        with:
          version: 2026.9.13
          install_args: rust mr-boxington
          cache: true
      - name: Add the static Linux target
        run: mise x -- rustup target add "$TARGET"
      - name: Cache builds with mbx
        uses: jdx/mr-boxington-action@9df1d4b18b2147788a7ee7a2c7b84ecf62fd89d3 # v1.5.0
      - name: Build static binary
        run: mise x -- cargo build --release --locked --target "$TARGET"
      - name: Package asset
        run: |
          binary="target/$TARGET/release/forkctl"
          version_output=$("$binary" --version)
          version=${version_output#forkctl }
          [ "v$version" = "$TAG" ] || { printf 'release: binary reports %s for tag %s\n' "$version_output" "$TAG" >&2; exit 1; }
          work=$(mktemp -d)
          cp "$binary" "$work/forkctl"
          asset="forkctl_${version}_linux_x64.tar.gz"
          tar czf "$asset" -C "$work" forkctl
          printf 'ASSET=%s\n' "$asset" >> "$GITHUB_ENV"
      - name: Upload asset
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release upload "$TAG" "$ASSET" --repo "$GITHUB_REPOSITORY" --clobber
      - name: Verify uploaded asset
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          download=$(mktemp -d)
          gh release download "$TAG" --repo "$GITHUB_REPOSITORY" --pattern "$ASSET" --dir "$download"
          cmp -s "$ASSET" "$download/$ASSET"
          tar xzf "$download/$ASSET" -C "$download"
          "$download/forkctl" --version
