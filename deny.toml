[graph]
all-features = true

[advisories]
yanked = "deny"
unmaintained = "all"
# RUSTSEC ids and yanked crates that cannot be upgraded yet. Not a lint-level downgrade.
ignore = [
    { id = "RUSTSEC-2026-0374", reason = "basic-toml is unmaintained, with no safe upgrade. askama 0.16 reaches it only through its config feature, the one way to load templates from files. Remove when askama drops basic-toml or forkctl inlines its templates." },
]

[licenses]
allow = [
    "MIT",
    "Apache-2.0",
    "Apache-2.0 WITH LLVM-exception",
    "Unicode-3.0",
    # encoding_rs, which serde-saphyr pulls in
    "BSD-3-Clause",
]
confidence-threshold = 0.93

[bans]
# Two versions of one crate fail. A repository whose dependencies still need
# two versions, after updating each to its latest release, adds a skip below
# deny = [...], one entry per crate with the reason, and removes it when the
# graph converges:
# skip = [{ crate = "syn@2", reason = "<crate> <version>, the latest, requires syn 2" }]
multiple-versions = "deny"
wildcards = "deny"
# Path dependencies carry no version; wildcards stay denied for the rest.
allow-wildcard-paths = true
highlight = "all"
deny = [
    { crate = "openssl", reason = "TLS is rustls" },
    { crate = "native-tls", reason = "TLS is rustls" },
]

# Declarations repeated outside [workspace.dependencies], and unused entries.
[bans.workspace-dependencies]
duplicates = "deny"
unused = "deny"

[sources]
unknown-registry = "deny"
unknown-git = "deny"
allow-registry = ["https://github.com/rust-lang/crates.io-index"]
