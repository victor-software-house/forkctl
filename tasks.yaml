# yaml-language-server: $schema=https://github.com/victor-software-house/qctl/releases/download/v0.5.9/tasks.schema.json
schema_version: 4
prefix: FRK

style:
  timezone: "-03:00"
  section_order: [queue, horizon, archive]
active: FRK-028
queue:
  - id: FRK-028
    title: Restore full patch names on operation abort
    scope: operation
    outcome: >-
      operation abort restores every patch under its journal name, whatever
      stgit.namelength is set to.
    blocked_by: []
    acceptance:
      - A lifecycle test with a patch name longer than 30 characters aborts a conflicted refresh with stgit.namelength unset, and abort succeeds with the original series.
      - restore_operation_stack passes the journal's patch names to stg uncommit, as init hydration already does.
    notes:
      - 'Seen downstream on 0.0.20 and 0.0.38: abort rebuilt a stack with stg uncommit --to, which names patches from commit subjects cut to 30 characters, so the restored series did not match the journal and abort failed. Setting stgit.namelength to 0 works around it.'
horizon:
  - id: FRK-009
    title: Install StGit without compiling it
    scope: distribution
    outcome: The mounted fork task installs StGit from a prebuilt binary.
    kind: research
    open: StGit 2.6.1 ships .deb, .rpm, .msi and a source tarball, with no macOS binary, and no mise backend is known to install a prebuilt StGit on both Linux and macOS.
    notes:
      - The mounted task and the repository mise.toml install StGit as cargo:stgit, which compiles from source on every new runner.

  - id: FRK-016
    title: Separate tool faults from failed checks in check
    scope: check
    outcome: forkctl check reports a tool fault, such as a git that cannot start, as internal_error, and reserves check_failed for repository drift.
    kind: evaluation
    open: Changing the code a client sees is a protocol contract change. It needs an OpenSpec change and a decision on which read failures count as drift, such as a missing ledger.
    notes:
      - 'Raised in review of pull request 23: check maps every untyped failure to check_failed, as it did before the AppError refactor.'

  - id: FRK-015
    title: Bound test parallelism on a shared build host
    scope: build
    outcome: 'Running forkctl tests on a shared build host does not saturate it: the slow suite runs with bounded parallelism or on a manually started runner.'
    notes:
      - On 2026-09-29 a pre-push verify ran one lifecycle test per CPU, each spawning git and StGit, on a host already at load 40 to 130 and nearly out of swap. The same suite took 32 s on a Namespace Linux 8x16 instance and 63 s on macOS 6x14.
      - The operator wants slow suites to run only on approval, with merge blocked until they have run.
    kind: deferred
    open: Deferred by the operator on 2026-10-05; needs a decision on how a manually approved slow-test run blocks merge.
