  - id: FRK-017
    title: Recover a refresh whose worktree turns dirty mid-run
    scope: refresh
    outcome: A patch refresh that fails its final check after writing its commit leaves one operation whose status names the recovery, and patch finish waits until that operation is done.
    notes:
      - 'Reported from a downstream on 0.0.30: a mise run inside patch refresh of the bookkeeping patch rewrote mise.lock with gh entries for every platform. Refresh then failed with dirty_worktree after writing the new commit, leaving a patchrefresh operation in phase refreshing with next none.'
      - After mise.lock was restored, patch finish passed and operation continue reported completed. But the patch stayed active, so publish failed with active_patch_exists until a second patch finish.
      - 'Repro conditions: lockfile = true, an aqua tool newly added to [tools], and only some platforms locked.'
    plan: openspec/changes/archive/2026-10-11-recover-refresh-after-final-check/proposal.md
    completed: 2026-10-06T12:09:40
    evidence:
      - 12873813216e79c709c293c8c319cad9419db129
    disposition: completed

