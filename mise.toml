# The latest stable mise is the floor; CI pins the same version.
min_version = "2026.10.9"

[settings]
# mise loads git:: task includes only in experimental mode.
experimental = true
lockfile = true
# The platforms CI and contributors use. Without it, mise install fills every
# tool up to the platforms any tool already records, and rewrites the locks.
lockfile_platforms = ["linux-x64", "macos-arm64"]

# Every tool this root declares must match mise.lock or mise.<env>.lock.
[tool_config]
locked = true

# The toolchain lives here, not in mise.dev.toml, because CI loads only
# MISE_ENV=ci. The stable pin equals rust-toolchain.toml and rust-version.
[tools]
rust = [
  # Pinned stable: build, lint, test.
  { version = "1.99.0", components = "clippy", mr_boxington = true },
  # Formatting only, for rustfmt's unstable options.
  { version = "nightly-2026-09-29", profile = "minimal", components = "rustfmt" },
]
mr-boxington = "1.24.0"
"github:EmbarkStudios/cargo-deny" = "0.20.2"
"github:bnjbvr/cargo-machete" = "0.9.2"
jq = "1.8.2"
# forkctl's own tools.
"cargo:stgit" = { version = "2.6.1", depends = ["rust"] }
# test runs on nextest, and test:isolated runs it one test at a time.
"github:nextest-rs/nextest" = "cargo-nextest-0.9.143"
usage = "6.11.1"
gh = "2.95.0"
"github:victor-software-house/verctl" = "0.4.0"
# Test-only: the declared-check lifecycle test exercises a real ast-grep command. Consumers
# name their own tools in their own mise.toml; forkctl ships no check tooling.
ast-grep = "0.45.0"
# Test-only: the hook-composition test runs a real lefthook, and CI loads no dev profile.
# version:check keeps it equal to mise.dev.toml's, which arms the hooks.
lefthook = "2.2.2"
# The repository checks (mise-tasks/repo.toml).
taplo = "0.10.0"
rumdl = "0.2.79"
typos = "1.51.1"
actionlint = "1.7.12"
# OpenSpec runs on node.
node = "24.21.0"
"npm:@fission-ai/openspec" = "1.14.1"

# mise-tasks/ holds this repository's task fragments and file tasks. An
# includes list replaces the default task dirs, so mise-tasks comes first; add
# pinned git:: catalogs after it.
[task_config]
includes = [
  # Pinned git:: catalogs follow mise-tasks.
  "mise-tasks",
  # The qctl ref is the v0.4.4 tag's commit.
  "git::https://github.com/victor-software-house/qctl.git//tasks/q?ref=8d69a9e5065038cedd6a4cca228c5ff62ef41500",
  # The standard Rust tasks (check:toolchain, format, lint, test, test:doc,
  # deny, deny:advisories, deps, semver, verify).
  "git::https://github.com/victor-software-house/ctl-core.git//tasks/rust.toml?ref=v0.6.15",
]

# The one task here: the last include wins over mise-tasks/, so only an inline
# task replaces the catalog's cargo test. nextest gives each test its own
# process, which the lifecycle fixtures rely on.
[tasks.test]
description = "Unit and integration tests on nextest"
run = "cargo nextest run --workspace --all-features"
timeout = "30m"

# forkctl has no library target, and cargo test --doc refuses a package without one,
# so this replaces the catalog's doc-test task. A library target would bring it back.
[tasks."test:doc"]
description = "No doc-tests: forkctl has no library target"
run = "true"

[tool_alias]
# Same backend under every mise version, so the lock does not change with the
# mise that wrote it.
"usage" = "aqua:jdx/usage"
