# The latest stable mise is the floor; CI pins the same version.
min_version = "2026.10.3"

[settings]
lockfile = true

# Every tool declared here must match mise.lock.
[tool_config]
locked = true

[task_config]
# The qctl ref is the v0.4.4 tag's commit.
includes = [
  "git::https://github.com/victor-software-house/qctl.git//tasks/q?ref=8d69a9e5065038cedd6a4cca228c5ff62ef41500",
]

[tools]
rust = { version = "1.97.1", components = "rustfmt,clippy", mr_boxington = true }
mr-boxington = "1.20.0"
"cargo:stgit" = { version = "2.6.1", depends = ["rust"] }
"github:nextest-rs/nextest" = "cargo-nextest-0.9.143"
"github:EmbarkStudios/cargo-deny" = "0.20.2"
"github:bnjbvr/cargo-machete" = "0.9.2"
lefthook = "2.1.10"
gitleaks = "8.30.0"
usage = "6.11.1"
gh = "2.95.0"
"github:victor-software-house/verctl" = "0.3.9"
# Test-only: the declared-check lifecycle test exercises a real ast-grep command. Consumers
# name their own tools in their own mise.toml; forkctl ships no check tooling.
ast-grep = "0.45.0"

[tasks."format:fix"]
description = "Format Rust sources"
run = "cargo fmt --all"

[tasks.format]
description = "Check Rust formatting"
run = "cargo fmt --all -- --check"

[tasks."lint:fix"]
description = "Apply machine-fixable Clippy suggestions"
run = "cargo clippy --fix --allow-dirty --allow-staged --workspace --all-targets --all-features -- -D warnings"
env.CARGO_TARGET_DIR = "target/lint"

[tasks.lint]
description = "Run Clippy with warnings denied"
run = "cargo clippy --workspace --all-targets --all-features -- -D warnings"
env.CARGO_TARGET_DIR = "target/lint"

[tasks.test]
description = "Parallel test suite via nextest"
run = "cargo nextest run --workspace --all-features"
env.CARGO_TARGET_DIR = "target/test"

[tasks."test:doc"]
description = "Doc-tests (nextest does not run these)"
run = "cargo test --doc --workspace --all-features"
env.CARGO_TARGET_DIR = "target/doc-test"

[tasks."test:isolated"]
description = "Same suite, one test at a time"
run = "cargo nextest run --workspace --all-features --test-threads=1"
env.CARGO_TARGET_DIR = "target/test-isolated"

[tasks.deny]
description = "License, ban, and source policy (offline)"
run = "cargo-deny check licenses bans sources"

[tasks."deny:advisories"]
description = "RustSec advisories and yanked crates (network, CI only)"
run = "cargo-deny check advisories"

[tasks.deps]
description = "Unused crate analysis"
run = "cargo-machete"

[tasks."hooks:secrets:staged"]
description = "Scan staged blobs for secrets"
run = "gitleaks git --staged --redact --no-banner"

[tasks."hooks:secrets:history"]
description = "Scan reachable history for secrets"
run = "gitleaks git --redact --no-banner"

[tasks."version:sync"]
description = "Regenerate the lockfile and all tool pins from mise.toml"
run = ["mise lock", "cargo run --quiet --package forkctl-xtask"]
env.CARGO_TARGET_DIR = "target/xtask"

[tasks."version:check"]
description = "Verify generated tool pins match mise.toml"
run = "cargo run --quiet --package forkctl-xtask -- --check"
env.CARGO_TARGET_DIR = "target/xtask"

[tasks.verify]
description = "Offline gate: format, clippy, nextest, deny, unused-deps, version pins"
# mbx shares one store and compiler pool; separate target dirs keep Cargo's
# directory lock from serializing the parallel tasks.
depends = ["format", "lint", "test", "deny", "deps", "version:check"]

[tasks.build]
description = "Build the release binary"
run = "cargo build --release"
env.CARGO_TARGET_DIR = "target/build"

[tool_alias]
# Same backend under every mise version, so the lock does not change with the
# mise that wrote it.
"usage" = "aqua:jdx/usage"
